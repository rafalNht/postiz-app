# Postiz - Coolify deployment (branch: coolify)
# Based on the official docker-compose.yaml in this repo, adapted for Coolify:
# - No host ports (Coolify proxy routes https://postiz.rafal.fun -> postiz:5000)
# - All data volumes are named (safe across redeploys)
# - Secrets generated by Coolify (SERVICE_PASSWORD_* magic variables)
# - Temporal listens on all interfaces (fixes the "two networks" issue seen on Dittofeed)
# - Removed dev-only services: spotlight, temporal-ui, temporal-admin-tools
# - Resource limits per service (total max ~7.5 GB RAM)

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
    environment:
      # --- Required ---
      MAIN_URL: https://postiz.rafal.fun
      FRONTEND_URL: https://postiz.rafal.fun
      NEXT_PUBLIC_BACKEND_URL: https://postiz.rafal.fun/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      DATABASE_URL: postgresql://postiz:${SERVICE_PASSWORD_POSTGRES}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      # Keep false until you create your own account, then set to true and redeploy
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}

      # --- Storage (local disk) ---
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads

      # --- Social platforms (fill in Coolify > Environment Variables when connecting each one) ---
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}

      # --- AI (optional) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    expose:
      - "5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7.2
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    volumes:
      - postiz-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Temporal (job scheduling) ----------------
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    expose:
      - "9200"

  temporal-postgresql:
    image: postgres:16
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_TEMPORAL}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${SERVICE_PASSWORD_TEMPORAL}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
      # Fix for Coolify attaching two networks (same fix applied to Dittofeed)
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_BROADCAST_ADDRESS=127.0.0.1
    expose:
      - "7233"

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  temporal-es-data:
  temporal-postgres-data:
